    <button onClick="clearAllStorage()">Delete all storage</button>
    <script>
function clearAllStorage() {
    var host = location.hostname;
    var domains = ['', host, '.' + host];
    var paths = ['/', location.pathname, location.pathname.replace(/[^\/]*$/, '')];
    document.cookie.split(';').forEach(function (c) {
        var name = c.split('=')[0].trim();
        if (!name) return;
        domains.forEach(function (d) {
            paths.forEach(function (p) {
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + p + (d ? '; domain=' + d : '');
            });
        });
    });
    localStorage.clear();
    sessionStorage.clear();
    var idb = (window.indexedDB && indexedDB.databases) ? indexedDB.databases() : Promise.resolve([]);
    idb.then(function (dbs) {
        dbs.forEach(function (db) { indexedDB.deleteDatabase(db.name); });
    }).finally(function () {
        console.log('All cookies, localStorage, sessionStorage and IndexedDB deleted');
        location.reload();
    });
}
    </script>
